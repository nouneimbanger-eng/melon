name: Build Melo APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Extract project
        run: unzip -o Melo.zip -d .

      - name: Fix launcher icon
        run: sed -i 's/android:icon="@mipmap\/ic_launcher"//g' Melo/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd Melo
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Melo-V2-APK
          path: Melo/app/build/outputs/apk/debug/app-debug.apk
